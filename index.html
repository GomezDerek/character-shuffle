!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Character Shuffle!</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
  </head>  
  <body>
    
    <div id="frame">
    <h1>CHARACTER GENERATOR</h1>
    
    <div id="character-area">
      
      <div id="stats-section">
        <p>
          <span class="stat">ATTACK:</span>  
          &nbsp &nbsp &nbsp <span id="attack-Stat">Pending</span>  
        </p>
        <p>
          <span class="stat">DEFENSE:</span>    
          &nbsp &nbsp <span id="defense-Stat">Pending</span>
        </p>
        <p>
          <span class="stat">SPEED:</span>  
          &nbsp &nbsp &nbsp <span id="speed-Stat">Pending</span>  
        </p>
        <p>
          <span class="stat">ABILITY:</span>
          &nbsp <span id="ability-Stat">Pending</span>
        </p>
        <p>
          <span class="name">NAME:</span>
          &nbsp <span id="full-Name">Pending</span>
        </p>
      
      
      </div>
      
        <div id="character-image">
          <img id="character-display" src=""></img>
          <img id="torso-display" src=""></img>
          <img id="head-display" src=""></img>
          <img id="legs-display" src=""></img>
          <img id="hair-display" src=""></img>
        </div>
    </div>
  
    <div id="button-div">
      <button id="shuffle-button" type="button">SHUFFLE</button>
    </div>
    </div>
  
  </body>
</html>
