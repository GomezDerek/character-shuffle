name: Sync to website

# Copies the playable game files into GomezDerek/website at games/character-shuffle/
# so they're served at https://derekgomez.dev/games/character-shuffle/
#
# Only the files the game loads are copied: index.html, style.css, script.js,
# possibilities.js, and the top-level files in assets/. The assets/unused/
# subfolder (Glitch library extras the code never references) is NOT copied.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: sync-to-website
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out character-shuffle
        uses: actions/checkout@v4

      - name: Check out website
        uses: actions/checkout@v4
        with:
          repository: GomezDerek/website
          token: ${{ secrets.WEBSITE_TOKEN }}
          path: website

      - name: Copy game files
        run: |
          dest=website/games/character-shuffle
          rm -rf "$dest"
          mkdir -p "$dest/assets"
          cp index.html style.css script.js possibilities.js "$dest/"
          # top-level assets only; assets/unused/ isn't loaded by the game
          find assets -maxdepth 1 -type f -exec cp {} "$dest/assets/" \;

      - name: Commit and push to website
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add -A games/character-shuffle
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore: sync character-shuffle from ${GITHUB_SHA::7}"
          git push
